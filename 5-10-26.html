<form action="/register" method="post">

    <label for="name">Name:</label>
    <input
        type="text"
        id="name"
        name="name"
    >

    <br><br>

    <label for="email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
    >

    <br><br>

    <p>Gender:</p>

    <input
        type="radio"
        id="male"
        name="gender"
        value="male"
    >
    <label for="male">Male</label>

    <input
        type="radio"
        id="female"
        name="gender"
        value="female"
    >
    <label for="female">Female</label>

    <br><br>

    <button type="submit">Register</button>

</form>
